# Robô da agenda do app "Papa Hoje" (SoulfulApps).
# A cada 6 h lê o calendário público do vatican.va (pt, es, en) e publica papa-hoje/agenda.json
# no GitHub Pages: https://danielbarretomei-cell2.github.io/app-privacy-policies/papa-hoje/agenda.json
# Só faz commit quando a agenda muda. Mexe apenas em papa-hoje/agenda.json.
name: Papa Hoje - agenda
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: papa-hoje-agenda
  cancel-in-progress: false
jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ler a agenda
        run: node papa-hoje/robo/agenda.js 3
        env:
          AGENDA_OUT: papa-hoje/agenda.json
      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papa-hoje/agenda.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "Papa Hoje: agenda atualizada automaticamente"
          git push
