# Robô da agenda do app "Papa Hoje" (SoulfulApps).
# A cada 6 h lê o calendário público do vatican.va (pt, es, en) e publica papa-hoje/agenda.json
# no GitHub Pages: https://danielbarretomei-cell2.github.io/app-privacy-policies/papa-hoje/agenda.json
# 1x por dia (06h17 UTC) também atualiza papa-hoje/viagens.json e papa-hoje/documentos.json.
# Também roda quando o código do robô (ou este arquivo) muda, para testar na hora.
# Só faz commit quando algo muda. Mexe apenas nesses 3 arquivos.
name: Papa Hoje - agenda
on:
  schedule:
    - cron: '17 0,12,18 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'papa-hoje/robo/**'
      - '.github/workflows/papa-hoje-agenda.yml'
permissions:
  contents: write
concurrency:
  group: papa-hoje-agenda
  cancel-in-progress: false
jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ler a agenda
        run: node papa-hoje/robo/agenda.js 3
        env:
          AGENDA_OUT: papa-hoje/agenda.json
      - name: Ler viagens e documentos (1x por dia, às 06h UTC)
        if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * *'
        run: node papa-hoje/robo/historico.js papa-hoje
      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papa-hoje/agenda.json papa-hoje/viagens.json papa-hoje/documentos.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "Papa Hoje: agenda atualizada automaticamente"
          git push
